name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satya
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: satya/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest

  contracts:
    name: contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satya-agent/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: forge test -vvv

  app:
    name: app (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satya-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: satya-agent/package-lock.json
      - run: npm ci
      - run: npm run build
